name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run the test suite
        run: python tests/smoke_test.py

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Smoke-test the installed wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          if [ -f "$RUNNER_TEMP/wheel-venv/Scripts/python.exe" ]; then
            VPY="$RUNNER_TEMP/wheel-venv/Scripts/python.exe"
            VBIN="$RUNNER_TEMP/wheel-venv/Scripts"
          else
            VPY="$RUNNER_TEMP/wheel-venv/bin/python"
            VBIN="$RUNNER_TEMP/wheel-venv/bin"
          fi
          "$VPY" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$VBIN/spritewright" --version
          "$VBIN/spritewright" palettes
          "$VBIN/spritewright" install-skill --target "$RUNNER_TEMP/skills" --dry-run
